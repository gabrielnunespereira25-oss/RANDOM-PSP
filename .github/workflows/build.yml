
name: Build RANDOM PSP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          test -f src/main.c
          test -f Makefile
          test -d assets/sprites
          echo "Estrutura encontrada."

      - name: Verificar bibliotecas PNG
        run: |
          test -f /usr/local/pspdev/psp/include/png.h
          echo "Cabecalho PNG encontrado."

      - name: Compilar
        run: |
          make clean
          make

      - name: Verificar EBOOT
        run: |
          test -s EBOOT.PBP
          ls -lh EBOOT.PBP

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: RANDOM-PSP-MENU-SPRITES
          path: EBOOT.PBP
          if-no-files-found: error
